openapi: 3.0.3
info:
  x-api-type: Shopper
  x-api-family: Product
  title: Shopper Delivery Estimates
  version: 1.2.0
  description: |-
    [Download API specification](https://developer.salesforce.com/static/commercecloud/commerce-api/shopper-delivery-estimates/shopper-delivery-estimates-oas-v1-public.yaml)

    # API Overview
    Use the Shopper Delivery Estimates API to retrieve carrier-calculated delivery date ranges for a single product at a destination postal code. The API is intended for product detail pages (PDP) where shoppers want to know when an item will arrive before adding it to a basket.

    ## Authentication & Authorization
    The Shopper Delivery Estimates API requires a shopper access token with `sfcc.shopper-delivery-estimates` and `sfcc.shopper-standard`.
servers:
  - url: https://{shortCode}.api.commercecloud.salesforce.com/product/shopper-delivery-estimates/v1
    variables:
      shortCode:
        default: shortCode
paths:
  /organizations/{organizationId}/delivery-estimates:
    parameters:
      - $ref: '#/components/parameters/organizationId'
    get:
      description: Returns delivery date estimates for the requested products at a destination postal code. Currently limited to one product per request.
      operationId: getDeliveryEstimates
      summary: Returns delivery date estimates for the requested product.
      security:
        - ShopperToken:
            - sfcc.shopper-delivery-estimates
            - sfcc.shopper-standard
        - ShopperClientContextToken:
            - sfcc.shopper-delivery-estimates
            - sfcc.shopper-standard
      parameters:
        - $ref: '#/components/parameters/productIds'
        - $ref: '#/components/parameters/postalCode'
        - $ref: '#/components/parameters/countryCode'
        - $ref: '#/components/parameters/siteId'
        - $ref: '#/components/parameters/sfdcUsid'
        - $ref: '#/components/parameters/sfdcDwDnt'
        - $ref: '#/components/parameters/personalized'
        - $ref: '#/components/parameters/sfdcShopperContext'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryEstimatesResult'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/401unauthorized'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    ShopperToken:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{shortCode}.api.commercecloud.salesforce.com/shopper/auth/v1/organizations/{organizationId}/oauth2/token
          scopes:
            sfcc.shopper-delivery-estimates: scope granting read-access to shopper delivery estimates endpoints
            sfcc.shopper-standard: scope granting read-access to standard shopper endpoints
    ShopperClientContextToken:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{shortCode}.api.commercecloud.salesforce.com/shopper/auth/v1/organizations/{organizationId}/oauth2/token?hint=client_context
          scopes:
            sfcc.shopper-delivery-estimates: scope granting read-access to shopper delivery estimates endpoints
            sfcc.shopper-standard: scope granting read-access to standard shopper endpoints
  schemas:
    OrganizationId:
      description: An identifier for the Salesforce Commerce Cloud organization the request is being made by.
      example: f_ecom_zzxy_prd
      type: string
      pattern: ^f_ecom_[a-z]{4}_(prd|stg|dev|s[0-9]{2}|[0-9]{3})$
    ProductId:
      minLength: 1
      maxLength: 100
      type: string
      description: The id (SKU) of the product.
      example: apple-ipod-classic
    CountryCode:
      pattern: ^[A-Z][A-Z]$
      description: A two letter uppercase country code conforming to the ISO 3166-1 alpha-2 standard.
      example: US
      type: string
    SiteId:
      minLength: 1
      maxLength: 32
      description: The identifier of the site that a request is being made in the context of.
      example: RefArch
      type: string
    Destination:
      description: The normalized destination used for estimation. Echoes the values supplied on the request.
      type: object
      required:
        - postalCode
        - countryCode
      properties:
        postalCode:
          description: The destination postal code.
          type: string
          minLength: 1
          maxLength: 20
          example: '10001'
        countryCode:
          allOf:
            - $ref: '#/components/schemas/CountryCode'
          description: The destination country as an ISO 3166-1 alpha-2 code.
    CurrencyCode:
      description: A three letter uppercase currency code conforming to the ISO 4217 standard, or the string `N/A` indicating that a currency is not applicable.
      pattern: ^([A-Z][A-Z][A-Z]|N/A)$
      example: USD
      type: string
    DeliveryWindow:
      description: A time window during which the delivery is expected.
      type: object
      required:
        - startAt
        - endAt
      properties:
        startAt:
          description: The earliest expected delivery timestamp (inclusive).
          type: string
          format: date-time
          example: '2026-04-30T14:00:00Z'
        endAt:
          description: The latest expected delivery timestamp (inclusive).
          type: string
          format: date-time
          example: '2026-04-30T18:00:00Z'
    ShippingOption:
      description: A delivery estimate for one applicable shipping method.
      type: object
      required:
        - shippingMethodId
      properties:
        shippingMethodId:
          description: The identifier of the shipping method.
          type: string
          minLength: 1
          maxLength: 256
          example: GroundShipping
        name:
          description: The localized name of the shipping method.
          type: string
          minLength: 1
          maxLength: 256
          example: Ground
        description:
          description: The localized description of the shipping method.
          type: string
          minLength: 1
          maxLength: 4000
          example: Standard ground shipping
        carrier:
          description: The carrier the provider resolved for this shipping method.
          type: string
          minLength: 1
          maxLength: 256
          example: UPS
        price:
          description: The estimated shipping cost for this shipping method, in the currency given by `currency`.
          type: number
          format: double
          minimum: 0
          example: 5.99
        currency:
          description: The ISO 4217 currency code for `price`.
          allOf:
            - $ref: '#/components/schemas/CurrencyCode'
        deliveryWindow:
          allOf:
            - $ref: '#/components/schemas/DeliveryWindow'
          description: The estimated delivery window for this shipping method.
        orderCutoffAt:
          description: The latest timestamp by which an order must be placed for the delivery window to apply.
          type: string
          format: date-time
          example: '2026-04-27T14:00:00Z'
        nonDeliverableReason:
          description: A SCREAMING_SNAKE_CASE code identifying why the provider could not deliver via this shipping method.
          type: string
          minLength: 1
          maxLength: 256
          example: INSUFFICIENT_INVENTORY
    ProductDeliveryEstimate:
      description: Delivery estimates for one product at a destination, broken down by applicable shipping method.
      type: object
      required:
        - productId
        - destination
        - shippingOptions
      properties:
        productId:
          $ref: '#/components/schemas/ProductId'
        destination:
          $ref: '#/components/schemas/Destination'
        shippingOptions:
          description: The array of shipping method estimates for the product at the destination.
          type: array
          items:
            $ref: '#/components/schemas/ShippingOption'
    DeliveryEstimatesResult:
      description: Result document containing per-product delivery estimates.
      type: object
      required:
        - productDeliveryEstimates
      properties:
        productDeliveryEstimates:
          description: The array of per-product delivery estimate entries.
          type: array
          items:
            $ref: '#/components/schemas/ProductDeliveryEstimate'
    ErrorResponse:
      type: object
      additionalProperties: true
      properties:
        title:
          description: A short, human-readable summary of the problem type.
          type: string
          maxLength: 256
        type:
          description: A URI reference that identifies the problem type.
          type: string
          maxLength: 2048
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          type: string
      required:
        - title
        - type
        - detail
  parameters:
    organizationId:
      description: An identifier for the Salesforce Commerce Cloud organization the request is being made by.
      name: organizationId
      in: path
      required: true
      example: f_ecom_zzxy_prd
      schema:
        $ref: '#/components/schemas/OrganizationId'
    productIds:
      name: productIds
      description: The IDs of the products for which to retrieve delivery estimates. Currently limited to one ID per request.
      in: query
      example: apple-ipod-shuffle
      style: form
      explode: false
      required: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ProductId'
        minItems: 1
        maxItems: 1
        example:
          - apple-ipod-shuffle
    postalCode:
      name: postalCode
      description: The destination postal code for which to compute delivery estimates.
      in: query
      example: '10001'
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 20
    countryCode:
      name: countryCode
      description: The destination country as an ISO 3166-1 alpha-2 country code.
      in: query
      example: US
      required: true
      schema:
        $ref: '#/components/schemas/CountryCode'
    siteId:
      description: The identifier of the site that a request is being made in the context of.
      name: siteId
      in: query
      required: true
      example: RefArch
      schema:
        $ref: '#/components/schemas/SiteId'
    sfdcUsid:
      description: A unique shopper identifier (USID) for tracking client context.
      name: sfdc_usid
      in: header
      required: false
      schema:
        type: string
        format: uuid
    sfdcDwDnt:
      description: Do Not Track header for privacy preferences.
      name: sfdc_dw_dnt
      in: header
      required: false
      schema:
        type: string
        enum:
          - '0'
          - '1'
    personalized:
      description: Controls whether personalization is applied to the response.
      name: personalized
      in: query
      schema:
        type: string
        enum:
          - none
    sfdcShopperContext:
      description: Shopper context information passed in from a trusted backend application.
      name: sfdc_shopper_context
      in: header
      required: false
      schema:
        type: string
  responses:
    401unauthorized:
      description: Your access token is invalid or expired and cannot be used to identify a user.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
